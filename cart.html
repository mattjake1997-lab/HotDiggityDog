<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot Dog Cart Menu | Hot Diggity Dog</title>
<meta name="description" content="Hot Diggity Dog hot dog cart menu: any dog $5, sandwiches, nachos, chips and drinks.">
<link rel="icon" href="img/mascot.png">
<link rel="canonical" href="https://www.hotdiggitydogtruck.com/cart.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--yellow:#F6C619;--orange:#F2711C;--red:#D62828;--green:#1F6B57;--cream:#FFF6E4;--ink:#24160F;--muted:#6B5546}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--cream)}
header{background:var(--red);border-bottom:4px solid var(--ink)}
.bar{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.bar img{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.bar h1{margin:0;font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:1px;color:var(--yellow);font-size:clamp(1.6rem,5vw,2.3rem);line-height:1;-webkit-text-stroke:1px var(--ink)}
.bar small{display:block;color:#fff;font-weight:800;font-size:.85rem}
.back{margin-left:auto;color:#fff;font-weight:900;text-decoration:none;white-space:nowrap;font-size:.95rem}
main{max-width:900px;margin:0 auto;padding:18px 16px 40px}
.note{background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:800;text-align:center;box-shadow:4px 4px 0 var(--ink)}
.note b{color:var(--red)}
.menu{display:block;width:100%;height:auto;margin:18px 0;border-radius:14px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--orange)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:block;text-align:center;font-weight:900;text-decoration:none;padding:13px 10px;border-radius:999px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}.btn.light{background:#fff;color:var(--ink)}
footer{text-align:center;color:var(--muted);font-weight:700;font-size:.85rem;padding:0 16px 30px}
</style>
</head>
<body>
<header><div class="bar">
  <img src="logo.png" alt="Kasantú Hot Diggity Dog cart logo">
  <div><h1>Hot Dog Cart Menu</h1><small>Hot Diggity Dog · Just doggin' around</small></div>
  <a class="back" href="./">← Truck site</a>
</div></header>
<main>
  <p class="note">🌭 These are <b>cart</b> prices. Order and pay right at the cart. The truck menu is on the <a href="./#menu">main page</a>.</p>
  <img class="menu" src="img/cart-menu.jpg" width="1632" height="2112" alt="Hot dog cart menu. Any dog $5: Jumbo Angus, Jumbo Traditional, Polish Sausage or Brat. Styles: Firecracker, South of the Border, Fiery Diggity, Sweet and Spicy, Spanish Dog, Street Dog, German Dog, Chicago Dog, or build your own with up to 5 free toppings, 50 cents each extra. BBQ pulled pork or pulled chicken sandwich $7, combo with chips and a drink $9. Nachos $6 with cheese sauce, chili dog sauce, jalapeños, diced onion and sour cream. Loaded nachos $8 with BBQ pulled pork instead of chili dog sauce. Chips, soda and hot cocoa $2 each.">
  <div class="btns">
    <a class="btn red" href="cart-menu.pdf" download>⬇ Download PDF</a>
    <a class="btn light" href="./">See the truck site</a>
  </div>
</main>
<footer>Call (812) 589-1202 · hotdiggidydog2020@gmail.com<br>Website by Matthew Jake · Cornerstone Forge</footer>
</body>
</html>
